[package]
name = "roblox-account-manager"
version = "4.0.1"
description = "Roblox Account Manager"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "RobloxAccountManager"
path = "src/main.rs"

# command line, a console program so it can print (the app itself has no console)
[[bin]]
name = "ram-cli"
path = "src/bin/ram-cli.rs"

[lib]
name = "ram"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "native-tls", "stream"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"
chrono = "0.4"
regex = "1"
rand = "0.8"
sha2 = "0.10"
md-5 = "0.10"
argon2 = "0.5"
crypto_secretbox = "0.1"
base64 = "0.22"
ed25519-dalek = "2"
urlencoding = "2"
tiny_http = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.32"
winreg = "0.52"
rfd = "0.15"
log = { version = "0.4", features = ["std"] }
once_cell = "1"
anyhow = "1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Memory",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Pipes",
    "Win32_System_Console",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Argon2 is slow unoptimized, keep the tests fast
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
